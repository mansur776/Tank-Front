<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Иконка Танкового Фронта</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;flex-direction:column;gap:20px;padding:20px;}
canvas{border:2px solid #7fbf3f;border-radius:12px;box-shadow:0 0 40px rgba(127,191,63,.5);}
.tip{color:#7fbf3f;font-family:monospace;font-size:13px;text-align:center;max-width:512px;letter-spacing:1px;line-height:1.6;}
</style>
</head>
<body>
<canvas id="icon" width="512" height="512"></canvas>
<div class="tip">ЗАЖМИ КАРТИНКУ НА 2 СЕКУНДЫ → "СОХРАНИТЬ ИЗОБРАЖЕНИЕ"<br>ИЛИ СДЕЛАЙ СКРИНШОТ И ОБРЕЖЬ ДО 512x512</div>
<script>
const c=document.getElementById("icon"),x=c.getContext("2d");
const W=512,H=512;
const bg=x.createRadialGradient(W/2,H/2,50,W/2,H/2,W*0.75);
bg.addColorStop(0,"#1a2a1a");bg.addColorStop(0.5,"#0d150d");bg.addColorStop(1,"#050805");
x.fillStyle=bg;x.fillRect(0,0,W,H);
for(let i=0;i<80;i++){x.globalAlpha=0.3+Math.random()*0.5;x.fillStyle="#a6efff";const s=Math.random()*2+0.5;x.fillRect(Math.random()*W,Math.random()*H,s,s);}
x.globalAlpha=1;
x.strokeStyle="#7fbf3f";x.lineWidth=8;
x.beginPath();x.arc(W/2,H/2,W*0.44,0,Math.PI*2);x.stroke();
x.strokeStyle="rgba(127,191,63,.3)";x.lineWidth=2;
x.beginPath();x.arc(W/2,H/2,W*0.46,0,Math.PI*2);x.stroke();
x.strokeStyle="rgba(80,120,60,.15)";x.lineWidth=1;
for(let i=0;i<W;i+=32){x.beginPath();x.moveTo(i,60);x.lineTo(i,H-60);x.stroke();x.beginPath();x.moveTo(60,i);x.lineTo(W-60,i);x.stroke();}
x.save();x.translate(W/2,H/2-30);x.scale(4.5,4.5);
const tw=42,th=34;
x.fillStyle="rgba(0,0,0,.5)";x.beginPath();x.ellipse(4,6,tw*0.6,th*0.55,0,0,Math.PI*2);x.fill();
x.fillStyle="#1a1a1a";x.fillRect(-tw/2,-th/2,tw,th*0.24);x.fillRect(-tw/2,th/2-th*0.24,tw,th*0.24);
x.fillStyle="#333";
for(let i=-tw/2+4;i<tw/2-4;i+=7){x.fillRect(i,-th/2+2,3,th*0.24-4);x.fillRect(i,th/2-th*0.24+2,3,th*0.24-4);}
const g=x.createLinearGradient(0,-th/3,0,th/3);
g.addColorStop(0,"#a0c070");g.addColorStop(0.5,"#5a7a3a");g.addColorStop(1,"#2a3a1a");
x.fillStyle=g;
x.beginPath();
x.moveTo(-tw*0.42,-th*0.28);x.lineTo(tw*0.42,-th*0.28);x.lineTo(tw*0.5,0);x.lineTo(tw*0.42,th*0.28);x.lineTo(-tw*0.42,th*0.28);x.lineTo(-tw*0.5,0);x.closePath();x.fill();
x.strokeStyle="#0a1a0a";x.lineWidth=1.2;x.stroke();
x.fillStyle="#dd2020";x.save();x.translate(-tw*0.15,0);
x.beginPath();
for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5,r=i===0?th*0.18:th*0.08;x.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
x.closePath();x.fill();x.restore();
x.fillStyle="rgba(0,0,0,.4)";x.beginPath();x.arc(tw*0.2,0,th*0.12,0,Math.PI*2);x.fill();
x.fillStyle="#4a5a2a";
x.beginPath();x.ellipse(0,0,tw*0.26,th*0.26,0,0,Math.PI*2);x.fill();
x.strokeStyle="#0a1a0a";x.lineWidth=1.2;x.stroke();
x.fillStyle="rgba(200,240,160,.4)";
x.beginPath();x.ellipse(-tw*0.06,-th*0.06,tw*0.12,th*0.08,0,0,Math.PI*2);x.fill();
x.fillStyle="#1a2a1a";x.fillRect(tw*0.18,-3,tw*0.68,6);
x.strokeStyle="#0a0a0a";x.lineWidth=1;x.strokeRect(tw*0.18,-3,tw*0.68,6);
x.fillStyle="#0a0a0a";x.fillRect(tw*0.82,-4,6,8);
x.restore();
x.textAlign="center";
x.fillStyle="#d4a53a";x.font="bold 24px 'Courier New'";
x.fillText("// 1943 //",W/2,95);
x.font="bold 38px 'Courier New'";
x.fillStyle="#7fbf3f";
x.shadowBlur=20;x.shadowColor="#7fbf3f";
x.fillText("ТАНКОВЫЙ",W/2,H-110);
x.fillText("ФРОНТ",W/2,H-60);
x.shadowBlur=0;
x.fillStyle="rgba(127,191,63,.5)";
x.fillRect(W/2-100,H-35,200,2);
</script>
</body>
</html>
